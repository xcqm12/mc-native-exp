name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build (logo icon embedded via build.rs)
        run: cargo build --release
        shell: pwsh

      - name: Prepare artifact
        shell: pwsh
        run: |
          $version = (Get-Content Cargo.toml -Raw | Select-String 'version = "([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target/release/mc-native-exp.exe "staging/mc-native-exp-$version-windows-x64.exe"
          "version=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-ChildItem staging | Format-Table Name, Length

      - name: Upload artifact (every push)
        uses: actions/upload-artifact@v4
        with:
          name: mc-native-exp-${{ env.version }}-windows-x64
          path: staging/*

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}（实验 · 可能不稳定）"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: true
          files: staging/*
