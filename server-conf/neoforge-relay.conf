# mc-native-exp 实验项目：NeoForge maven 中转 + 落盘缓存
# 首次请求由 nginx 从 maven.neoforged.net 拉取并落盘（服务器单连接稳定），
# 后续全部走静态文件。删除本文件即回滚；实验结束可移除。
location ^~ /neoforge-cache/ {
    root /www/wwwroot/mcdles.us.ci;
    try_files $uri @neoforge-fetch;
}
location @neoforge-fetch {
    internal;
    rewrite ^/neoforge-cache(/.*)$ $1 break;
    proxy_pass https://maven.neoforged.net;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host maven.neoforged.net;
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;
    proxy_store on;
    proxy_store_access user:rw group:rw all:r;
    root /www/wwwroot/mcdles.us.ci;
}
# 兼容旧 /neoforge-relay/ 直连中转（流式，大文件不稳）
location ^~ /neoforge-relay/ {
    proxy_pass https://maven.neoforged.net/;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host maven.neoforged.net;
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
}
